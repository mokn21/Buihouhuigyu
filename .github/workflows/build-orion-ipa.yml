name: Build Orion IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Orion Subtitles IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Download source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Apple build environment
        run: xcodebuild -version

      - name: Install build tools
        run: brew install cmake ninja xcodegen

      - name: Build the free OPUS-MT English-Arabic Core ML model
        run: |
          set -euo pipefail
          python3 -m venv .venv-ai
          source .venv-ai/bin/activate
          python -m pip install --upgrade pip
          python -m pip install 'transformers>=4.40,<5' 'torch>=2.2,<2.6' 'coremltools>=8,<9' sentencepiece safetensors
          rm -rf App/AIModel
          mkdir -p App/AIModel
          python scripts/convert-opus-mt-coreml.py --output App/AIModel
          test -d App/AIModel/OpusMTEnglishArabicEncoder.mlpackage
          test -d App/AIModel/OpusMTEnglishArabicDecoder.mlpackage
          test -f App/AIModel/source.spm
          test -f App/AIModel/target.spm
          du -sh App/AIModel

      - name: Verify source tree and dependencies
        run: |
          set -euo pipefail
          test -f project.yml
          test -f .gitmodules
          test -f ChiakiKit/CMakeLists.txt
          test -f ChiakiKit/include/ck_bridge.h
          test -f scripts/build-chiaki.sh
          test -f scripts/package-ipa.sh
          test -f scripts/verify-ipad-ipa.sh
          test -f vendor/chiaki-ng/CMakeLists.txt
          test -f vendor/mbedtls/CMakeLists.txt
          test -f vendor/opus/CMakeLists.txt
          git submodule status --recursive
          echo "PASS: project files and recursive submodule dependencies are available."

      - name: Run translation request management tests
        run: |
          set -euo pipefail
          chmod +x scripts/build-chiaki.sh
          scripts/build-chiaki.sh
          xcodegen generate
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next((d["udid"] for devices in data.get("devices", {}).values() for d in devices if "iPad" in d.get("name", "") and d.get("isAvailable", False)), ""))')"
          if [ -n "$DEVICE_ID" ]; then
            xcodebuild -project OrionSubtitles.xcodeproj -scheme OrionSubtitlesTests \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
          else
            echo "No iPad Simulator is installed; compiling the XCTest target without claiming execution."
            xcodebuild build-for-testing -project OrionSubtitles.xcodeproj -scheme OrionSubtitlesTests \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Build unsigned iPad IPA
        env:
          VERSION: 0.1.0
          BUILD_NUMBER: ${{ github.run_number }}
          BUNDLE_ID: com.orion.subtitles
        run: |
          set -euo pipefail
          chmod +x scripts/build-chiaki.sh scripts/package-ipa.sh scripts/verify-ipad-ipa.sh
          scripts/package-ipa.sh

      - name: Verify iPad IPA and Bundle ID
        env:
          EXPECTED_BUNDLE_ID: com.orion.subtitles
        run: scripts/verify-ipad-ipa.sh build/Orion-Subtitles.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: orion-subtitles-ipa
          path: build/Orion-Subtitles.ipa
          if-no-files-found: error
          retention-days: 7
